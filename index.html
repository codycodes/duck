<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Duck</title>
  <meta name="description" content="A tiny test web app you can add to your Dock or Home Screen.">
  <meta name="theme-color" content="#4fb3e8">

  <!-- Web app manifest (Safari 17+ "Add to Dock", iOS "Add to Home Screen") -->
  <link rel="manifest" href="manifest.webmanifest">

  <!-- Apple-specific web app tags -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Duck">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">

  <style>
    :root { --sky: #4fb3e8; --water: #2e8bc0; --duck: #ffd23f; --ink: #10324a; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Rounded", system-ui, sans-serif;
      background: linear-gradient(var(--sky) 60%, var(--water) 60%);
      color: var(--ink);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom);
      text-align: center; -webkit-user-select: none; user-select: none;
    }
    h1 { margin: 0 0 4px; font-size: 2.5rem; color: #fff; text-shadow: 0 2px 0 rgba(0,0,0,.15); }
    p  { margin: 0 0 24px; color: #fff; opacity: .9; }
    #duck {
      width: 200px; height: 200px; border: 0; padding: 0; background: none; cursor: pointer;
      animation: bob 2.4s ease-in-out infinite; -webkit-tap-highlight-color: transparent;
    }
    #duck img { width: 100%; height: 100%; border-radius: 44px; box-shadow: 0 10px 30px rgba(0,0,0,.2); }
    #duck:active { transform: scale(.94); }
    @keyframes bob { 50% { transform: translateY(-10px) rotate(-3deg); } }
    .card {
      margin-top: 28px; background: rgba(255,255,255,.92); border-radius: 16px;
      padding: 14px 18px; max-width: 360px; width: 100%; font-size: .95rem;
    }
    .count { font-size: 1.6rem; font-weight: 700; }
    .mode { margin-top: 6px; font-size: .8rem; opacity: .7; }
  </style>
</head>
<body>
  <h1>Duck</h1>
  <p>Tap the duck.</p>
  <button id="duck" aria-label="Quack"><img src="icons/icon-512.png" alt=""></button>

  <div class="card">
    <div class="count"><span id="count">0</span> quacks</div>
    <div class="mode" id="mode"></div>
  </div>

  <script>
    const KEY = 'duck-quacks';
    const countEl = document.getElementById('count');
    let count = 0;
    try { count = Number(localStorage.getItem(KEY)) || 0; } catch {}
    countEl.textContent = count;

    let audio;
    function quack() {
      // Tiny synthesized "quack" so no audio file is needed.
      try {
        audio = audio || new (window.AudioContext || window.webkitAudioContext)();
        const o = audio.createOscillator(), g = audio.createGain();
        o.type = 'sawtooth';
        o.frequency.setValueAtTime(520, audio.currentTime);
        o.frequency.exponentialRampToValueAtTime(260, audio.currentTime + 0.18);
        g.gain.setValueAtTime(0.25, audio.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + 0.2);
        o.connect(g).connect(audio.destination);
        o.start(); o.stop(audio.currentTime + 0.2);
      } catch {}
      count++;
      countEl.textContent = count;
      try { localStorage.setItem(KEY, count); } catch {}
    }
    document.getElementById('duck').addEventListener('click', quack);

    const standalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone;
    document.getElementById('mode').textContent = standalone
      ? '🦆 Running as an installed web app'
      : 'In Safari: File → Add to Dock (Mac) or Share → Add to Home Screen (iPhone/iPad)';

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  </script>
</body>
</html>
